ces":["正三角形","鈍角三角形","不等辺三角形"],"answer":"直角二等辺三角形","explanation":"∠A = 180 - (45+45) = 90°。2角が等しいので直角二等辺三角形です。"},{"question":"△ABC で ∠A = 60°, ∠B = 60° のとき、△ABC はどんな三角形か？","choices":["直角三角形","二等辺三角形（正三角形ではない）","鈍角三角形"],"answer":"正三角形","explanation":"残りの∠Cも60度になり、3つの角が等しいため正三角形です。"},{"question":"証明の根拠として「共通な辺だから」が使えるのはどんなときか？","choices":["2つの三角形が離れているとき","辺の長さが2倍のとき","平行線があるとき"],"answer":"2つの三角形で同じ辺を共有しているとき","explanation":"図形が重なっていて同じ辺を使っているときに用います。"},{"question":"証明の根拠として「共通な角だから」が使えるのはどんなときか？","choices":["角の大きさが90度のとき","対頂角のとき","錯角のとき"],"answer":"2つの三角形で同じ角を共有しているとき","explanation":"頂点を共有し、同じ角が含まれているときに用います。"},{"question":"平行四辺形 ABCD の対角線の交点を O とするとき、△AOB ≡ △COD の証明で使う錯角はどれか？","choices":["∠AOB = ∠COD","∠ABC = ∠ADC","∠BAD = ∠BCD"],"answer":"∠OAB = ∠OCD","explanation":"AB // DC より、錯角である ∠OAB = ∠OCD を使います。"},{"question":"△ABC の辺 AB, AC の中点をそれぞれ D, E とするとき、AD : AB の比は？","choices":["1 : 3","2 : 1","1 : 1"],"answer":"1 : 2","explanation":"D は中点なので AD は AB の半分の長さ（1 : 2）です。"},{"question":"「〇〇ならば△△である」という形の主張を何というか？","choices":["証明","仮定","結論"],"answer":"命題","explanation":"数学的な主張の文を「命題」といいます。"},{"question":"命題「x = 3 ならば x^2 = 9 である」の仮定はどれか？","choices":["x^2 = 9","x = 9","x^2 = 3"],"answer":"x = 3","explanation":"「〜ならば」の前半部分が仮定です。"},{"question":"命題「x = 3 ならば x^2 = 9 である」の結論はどれか？","choices":["x = 3","x = 9","x^2 = 3"],"answer":"x^2 = 9","explanation":"「〜である」の後半部分が結論です。"},{"question":"命題「x^2 = 9 ならば x = 3 である」は正しい（真）か？","choices":["正しい（真）","常に成り立つ","xが正の数なら偽"],"answer":"正しくない（偽・x=-3がある）","explanation":"x = -3 のときも x^2 = 9 になるため反例が存在し偽です。"},{"question":"二等辺三角形 ABC (AB=AC) の頂角 A から底辺 BC に下ろした垂線を AD とするとき、△ABD ≡ △ACD の合同条件は？","choices":["3組の辺がそれぞれ等しい","1組の辺とその両端の角がそれぞれ等しい","2組の辺とその間の角がそれぞれ等しい"],"answer":"斜辺と他の1辺がそれぞれ等しい","explanation":"斜辺AB=AC, 共通の辺AD, ∠ADC=∠ADB=90° より「斜辺と他の1辺」です。"},{"question":"△ABC ≡ △DEF, △DEF ≡ △GHI のとき、△ABC と △GHI の関係は？","choices":["相似だが合同ではない","面積だけ等しい","関係はない"],"answer":"△ABC ≡ △GHI","explanation":"合同な図形と合同な図形は、互いに合同になります。"},{"question":"正三角形 ABC の各辺の上に AD=BE=CF となる点 D, E, F をとると △DEF はどんな三角形になるか？","choices":["直角三角形","二等辺三角形（正三角形でない）","不等辺三角形"],"answer":"正三角形","explanation":"周りの3つの三角形が合同になり、DE=EF=FD となるため正三角形です。"},{"question":"△ABC において ∠A の二等分線と BC の交点を D とするとき、必ず AD ⊥ BC となる条件は？","choices":["∠B = 90度","∠A = 90度","3辺の長さがすべて異なる"],"answer":"AB = AC (二等辺三角形)","explanation":"二等辺三角形の頂角の二等分線は底辺を垂直に分けるため、AB=AC が必要です。"},{"question":"2つの三角形 △ABC と △PQR で、AB=PQ, BC=QR, CA=RP のとき記号でどう表すか？","choices":["△ABC = △PQR","△ABC ∽ △PQR","△ABC ≒ △PQR"],"answer":"△ABC ≡ △PQR","explanation":"合同を表す記号は「≡」（三本線）です。"},{"question":"直角三角形の2つの鋭角の大きさの和は何度か？","choices":["180度","60度","120度"],"answer":"90度","explanation":"三角形の内角の和180度から直角90度を引くので 90度 です。"},{"question":"二等辺三角形の頂角が 80度 のとき、1つの底角の大きさは何度か？","choices":["80度","100度","40度"],"answer":"50度","explanation":"(180 - 80) ÷ 2 = 50度 です。"},{"question":"二等辺三角形の1つの底角が 70度 のとき、頂角の大きさは何度か？","choices":["70度","110度","50度"],"answer":"40度","explanation":"180 - (70 × 2) = 180 - 140 = 40度 です。"},{"question":"「対頂角は等しい」という性質は、証明なしで根拠として使ってよいか？","choices":["使ってはいけない","問題による","自分で証明してから使う"],"answer":"定理（性質）として使ってよい","explanation":"すでに正しいと証明されている基本的な性質なので根拠として使用できます。"}],"earth":[{"question":"水蒸気を多く含んだ空気が冷やされ、地表付近で発生する現象は？","choices":[],"answer":"霧","explanation":"太陽が出て気温が上がると水蒸気に戻り消える。"},{"question":"上昇気流によって空気中の水蒸気が水滴や氷の粒になり空に浮かぶものは？","choices":[],"answer":"雲","explanation":"見られる高さや形により10種類に分類される。"},{"question":"空に浮かぶ雲を高さや形によって分類した10種類の名称は？","choices":[],"answer":"十種雲形","explanation":"国際的に分類されている。"},{"question":"すじ雲とも呼ばれ、上層に見られる細いすじ状の雲は？","choices":[],"answer":"巻雲","explanation":"上層雲の代表例。"},{"question":"いわし雲やうろこ雲と呼ばれ、小さな雲のかたまりが並ぶ雲は？","choices":[],"answer":"巻積雲","explanation":"上層に見られる。"},{"question":"ひつじ雲と呼ばれ、羊の群れのようにかたまり状に並ぶ雲は？","choices":[],"answer":"高積雲","explanation":"中層雲の代表例。"},{"question":"あま雲やゆき雲と呼ばれ、厚く暗く広がり雨や雪を降らせる雲は？","choices":[],"answer":"乱層雲","explanation":"長雨をもたらす雲。"},{"question":"入道雲やかなとこ雲と呼ばれ、激しい雨や雷をもたらす巨大な雲は？","choices":[],"answer":"積乱雲","explanation":"強い上昇気流で垂直に発達する。"},{"question":"天気図上で同時刻に観測した海面更正気 swer":"リパーゼ","explanation":"すい液に含まれるリパーゼは脂肪を脂肪酸とモノグリセリドに分解します。"},{"question":"脂肪を乳化して消化を助ける胆汁はどこで作られるか。","choices":["胆のう","すい臓","胃"],"answer":"肝臓","explanation":"胆汁は肝臓で作られ、胆のうで濃縮・蓄積されたあと十二指腸へ分泌されます。"},{"question":"作られた胆汁が一時的にたくわえられる器官はどこか。","choices":["肝臓","十二指腸","小腸"],"answer":"胆のう","explanation":"肝臓で生成された胆汁は胆のうに蓄えられます。"},{"question":"胆汁には消化酵素が含まれているか、含まれていないか。","choices":["含まれている","条件による","一部含まれる"],"answer":"含まれていない","explanation":"胆汁に消化酵素は含まれませんが、脂肪を乳化してリパーゼの働きを助けます。"},{"question":"デンプンが最終的に分解されて吸収される形は何か。","choices":["麦芽糖","アミノ酸","脂肪酸"],"answer":"ブドウ糖","explanation":"デンプンは最終的に単糖類であるブドウ糖（グルコース）まで分解されます。"},{"question":"タンパク質が最終的に分解されて吸収される形は何か。","choices":["ペプトン","ブドウ糖","脂肪酸"],"answer":"アミノ酸","explanation":"タンパク質は最終的にアミノ酸まで分解されて小腸から吸収されます。"},{"question":"脂肪が分解されて生じる物質は脂肪酸と何というか。","choices":["グリコーゲン","ブドウ糖","アミノ酸"],"answer":"モノグリセリド","explanation":"脂肪（トリグリセリド）は脂肪酸とモノグリセリド（またはグリセリン）に分解されます。"},{"question":"小腸の内壁にある多数の細かな突起を何というか。","choices":["絨毛","鞭毛","繊毛"],"answer":"柔毛/じゅう毛","explanation":"小腸内壁の絨毛（じゅうもう）により、表面積が大幅に広がり吸収効率が高まります。"},{"question":"ブドウ糖やアミノ酸が吸収されたあと入る管は何か。","choices":["リンパ管","輸尿管","胆管"],"answer":"毛細血管","explanation":"水溶性のブドウ糖やアミノ酸は絨毛内の毛細血管へ入ります。"},{"question":"脂肪の分解物が再合成されたあと入る柔毛の中心にある管は何か。","choices":["毛細血管","血管","胆管"],"answer":"リンパ管","explanation":"脂溶性の脂肪分解物は絨毛内で再び脂肪になり、乳糜管（毛細リンパ管）へ入ります。"},{"question":"肝臓でブドウ糖が蓄えられるときの高分子の形は何か。","choices":["澱粉","アミロース","セルロース"],"answer":"グリコーゲン","explanation":"肝臓ではブドウ糖を多糖類であるグリコーゲンに変えて貯蔵します。"},{"question":"胃液に含まれる強酸性の物質は何か。","choices":["硫酸","硝酸","酢酸"],"answer":"塩酸","explanation":"胃液の塩酸は強い殺菌作用をもち、ペプシンを活性化させます。"},{"question":"すい液が分泌される小腸の先頭部分の名称は何か。","choices":["空腸","回腸","盲腸"],"answer":"十二指腸","explanation":"胃から送られた食片は十二指腸で胆汁やすい液と混ざり合います。"},{"question":"主に水分の吸収を行う器官はどこか。","choices":["小腸","胃","食道"],"answer":"大腸","explanation":"大腸は主に水とミネラルを吸収し、便を形成します。"},{"question":"麦芽糖をブドウ糖に分解する酵素は何か。","choices":["アミラーゼ","ペプシン","ラクターゼ"],"answer":"マルターゼ","explanation":"マルターゼは小腸上皮の細胞膜に存在し、麦芽糖をブドウ糖2分子に分解します。"},{"question":"口から肛門までの1本のつながった管を       const btn = document.createElement('button');
      btn.className = `tab-btn ${first ? 'active' : ''}`;
      btn.innerText = `${categoryLabels[key] || key} (${questions.length}問)`;
      btn.onclick = () => switchTab(key);
      tabMenu.appendChild(btn);
      const container = document.createElement('div');
      container.id = `cat-${key}`;
      container.className = `category-container ${first ? 'active' : ''}`;
      
      questions.forEach((q, index) => {
      let choicesHtml = '';
      if (q.choices && q.choices.length > 0) {
      choicesHtml = `<div class="choices"><strong>選択肢:</strong> ${q.choices.join(' / ')}</div>`;
      }
      
      container.innerHTML += `
      <div class="question-card">
        <div class="question-title">Q${index + 1}. ${q.question}</div>
        ${choicesHtml}
        <div class="answer">正解: ${q.answer}</div>
        <div class="explanation">解説: ${q.explanation}</div>
      </div>
      `;
      });
      
      contentArea.appendChild(container);
      first = false;
      }
      function switchTab(targetKey) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.category-container').forEach(c => c.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(`cat-${targetKey}`).classList.add('active');
      }
    </script>
  </body>
</html>
